name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'landing/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The site's Vite config imports @aylith/inspekt-vite, which resolves to
      # dist — so the workspace packages have to be built before the docs are.
      # This also builds the landing, which is a workspace member.
      - run: bun run build
      - run: bun run site:build

      # The landing owns the Pages root and the docs sit under /docs, which is
      # the split both sites are built against (SvelteKit `paths.base`,
      # VitePress `base`).
      - name: Assemble the Pages artifact
        run: |
          mkdir -p pages-artifact/docs
          cp -R landing/build/. pages-artifact/
          cp -R site/.vitepress/dist/. pages-artifact/docs/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-artifact

  deploy:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
