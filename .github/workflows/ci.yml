name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The site deploy runs on its own trigger and cannot be blocked by a workflow
  # that merely runs beside it, so it calls this gate as its own `verify` job.
  workflow_call:

jobs:
  verify:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Lint + format (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The published tarballs are what consumers actually install, so check the
      # declared entrypoints resolve against the built output rather than trusting
      # that `build` succeeded.
      - name: Verify published entrypoints
        run: bun run verify:exports

      - name: Build docs site
        run: bun run site:build
